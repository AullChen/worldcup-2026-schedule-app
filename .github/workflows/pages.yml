name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_refresh: ${{ steps.window.outputs.should_refresh }}
      refresh_reason: ${{ steps.window.outputs.refresh_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check refresh window
        id: window
        shell: bash
        env:
          REFRESH_WINDOW_MINUTES: 29
        run: npm --silent run refresh:check >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: github.event_name != 'schedule' || needs.gate.outputs.should_refresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm run build

      - name: Refresh static data cache
        run: npm run refresh:data

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [gate, build]
    if: github.event_name != 'schedule' || needs.gate.outputs.should_refresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
